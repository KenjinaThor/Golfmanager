<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Golfmanager" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background: #f7f8f7; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Auf grossen Bildschirmen als schmale Spalte wie auf dem Handy */
      @media (min-width: 640px) {
        body { background: #dfe5e0; }
        #root { max-width: 480px; margin: 0 auto; background: #f7f8f7; box-shadow: 0 0 40px rgba(0, 0, 0, 0.15); }
      }
    </style>
  </head>
  <body>
    <noscript>Golfmanager braucht JavaScript.</noscript>
    <div id="root"></div>
    <script>
      // Startfehler sichtbar machen: bleibt die App leer, zeigt die Seite den Fehler und einen Reset-Knopf.
      (function () {
        var lastError = '';
        window.addEventListener('error', function (e) { lastError = e.message || String(e.error || ''); });
        window.addEventListener('unhandledrejection', function (e) { lastError = String((e.reason && e.reason.message) || e.reason || ''); });
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.childNodes.length) return;
            root.style.cssText = 'display:block;padding:24px;font-family:system-ui,sans-serif;color:#14213d';
            root.innerHTML = '<h2>Golfmanager konnte nicht starten</h2><p style="color:#b42318;word-break:break-word"></p>' +
              '<p>Meist hilft es, den Zwischenspeicher der App zu leeren.</p>' +
              '<button style="padding:12px 16px;border:0;border-radius:10px;background:#1f7a3a;color:#fff;font-size:16px">Zwischenspeicher leeren und neu laden</button>';
            root.querySelector('p').textContent = lastError || 'Kein Fehlertext verfügbar.';
            root.querySelector('button').onclick = function () {
              Promise.all([
                navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0,
                window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0,
              ]).then(function () { location.reload(); });
            };
          }, 4000);
        });
      })();
    </script>
    <script>
      // Offline-Betrieb: Service Worker nur über https (oder localhost) registrieren
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
